name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The newest dependencies get the full `composer analyse`: php-cs-fixer, PHPStan, Rector,
  # composer-dependency-analyser and PHPUnit.
  analyse:
    name: Analyse (PHP ${{ matrix.php }}, newest dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - run: composer analyse

  # Older dependencies only get PHPUnit: PHPStan runs against the newest Symfony, whose interfaces
  # carry stricter types than 6.4 and 7.4 do. PHP 8.1 is the floor because Symfony 6.4 supports it.
  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        name: ['lowest dependencies', 'Symfony 6.4', 'Symfony 7.4']
        exclude:
          # Symfony 7 needs PHP 8.2.
          - php: '8.1'
            name: Symfony 7.4
        include:
          - name: lowest dependencies
            dependencies: lowest
          - name: Symfony 6.4
            dependencies: highest
            # A real 6.4 app has every component on 6.4. Not 6.4.*: property-info before 6.4.33
            # does not declare its conflict with reflection-docblock 6 and throws on use.
            symfony: '~6.4.33'
          - name: Symfony 7.4
            dependencies: highest
            symfony: '~7.4.0'
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin Symfony ${{ matrix.symfony }}
        if: matrix.symfony
        run: >-
          composer require --no-update --no-interaction
          "symfony/config:${{ matrix.symfony }}"
          "symfony/dependency-injection:${{ matrix.symfony }}"
          "symfony/http-kernel:${{ matrix.symfony }}"
          "symfony/property-access:${{ matrix.symfony }}"
          "symfony/property-info:${{ matrix.symfony }}"
          "symfony/serializer:${{ matrix.symfony }}"

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: vendor/bin/phpunit

  # Coverage is measured once, on the newest dependencies, and reported to Codecov for the README badge.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - run: vendor/bin/phpunit --coverage-clover coverage.xml

      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          # The repository upload token, from the repository's settings page on codecov.io.
          token: ${{ secrets.CODECOV_TOKEN }}
